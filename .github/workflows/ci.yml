name: Sharks Java CI #Verificação da minha Programação
on:
  push:
    branches: [mainCodeWithSimulation]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and run unit tests
        run: bash gradlew test build --no-daemon
